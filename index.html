<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean Picture Words</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">🇰🇷 Korean Picture Words</span>
    <button class="tab active" data-mode="learn">Learn</button>
    <button class="tab" data-mode="flash">Flashcards</button>
    <button class="tab" data-mode="choose">Choose</button>
    <button class="unit active" data-unit="words">Words</button>
    <button class="unit" data-unit="sentences">Sentences</button>
    <button class="random" id="randomBtn">🎲 Pick Random</button>
  </div>
</header>
<main id="app"></main>

<script src="app.js"></script>
</body>
</html>
